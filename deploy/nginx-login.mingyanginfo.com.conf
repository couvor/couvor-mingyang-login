# login.mingyanginfo.com — 明旸登录系统（SSO IdP）
# HTTPS 反代 Node.js 应用（127.0.0.1:3000，systemd: loginapp.service）
# HTTP：仅保留 ACME 验证，其余 301 跳转 HTTPS
#
# 说明：该站点配置曾随 /www/wwwroot/login.mingyanginfo.com 目录一并丢失，
# 导致域名落到宝塔默认站点（"恭喜，站点创建成功！"）。此文件用于恢复站点解析与反代。

server
{
    listen 80;
    listen [::]:80;
    server_name login.mingyanginfo.com;

    access_log /www/wwwlogs/login.mingyanginfo.com.log;
    error_log /www/wwwlogs/login.mingyanginfo.com.error.log;

    location ^~ /.well-known/acme-challenge/
    {
        root /www/wwwroot/login.mingyanginfo.com;
        default_type "text/plain";
        allow all;
    }

    location /
    {
        return 301 https://$host$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name login.mingyanginfo.com;
    client_max_body_size 10m;

    # 空闲连接 15 秒主动关闭（默认 60s）：认证流程中用户会在本站停留 40-90 秒
    # 输入密码/2FA，期间浏览器到客户端站点的 HTTP/2 连接若被中间 NAT 静默回收，
    # SSO 续接跳转复用死连接会黑洞挂起（表现为登录成功后不跳转、需手动刷新）。
    # 服务器在 NAT 回收阈值（约 30s）之前干净地关闭连接（发 GOAWAY/FIN），
    # 浏览器下次必走新连接。学桥 x.mingyanginfo.com 同步设置。
    keepalive_timeout 15s;

    ssl_certificate    /www/server/panel/vhost/cert/login.mingyanginfo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/login.mingyanginfo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /www/wwwlogs/login.mingyanginfo.com.log;
    error_log /www/wwwlogs/login.mingyanginfo.com.error.log;

    location /
    {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
